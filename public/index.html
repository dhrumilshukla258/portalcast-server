    <!--
      The cold-start intro (owner, 2026-10-24, "like Netflix's N"), as in the TV app
      (ui/intro/IntroScreen.kt): the P appears, its two signal arcs draw outward, then the P
      slides left while "ortalcast" comes out from behind it into the logo, holds, and fades
      into the app. About 1.8 s, once per browser tab; a click, tap or key skips it. It lives
      here, not in the bundle, so it plays while the app loads.

      Written for old browsers too (Tizen TVs, old phones): no inset, aspect-ratio or clamp().
      Only CSS animations of transform and opacity on whole layers, which the browser runs on
      its compositor: the motion stays smooth while the main thread parses the app (no script
      per frame). The letters come out from between two strips of the page colour that slide
      apart. Every layer is the logo's own box (viewBox 8 24 398 96, brand/build.sh), so a
      translateX of 1% is 3.98 logo units, and the last frame is the logo:
        P slide          167 units -> 0                  41.960% -> 0
        left strip edge  213.9 - 189.0u (+3 overlap)     -45.502% -> -92.990% (its right edge; the
                                                         overlap, under the P, closes the seam that
                                                         pixel-snapped layers left at the start)
        right strip edge 213.9 + 190.5u                   53.744% -> 101.608% (its left edge)
      (the same window the TV draws: the P's right edge, widening to the whole word).
    -->
    <style>

      #pc-intro .box { position: relative; width: 42vw; min-width: 240px; max-width: 1600px; } /* 42% of any screen; 240px at least */
      #pc-intro .box::before { content: ''; display: block; padding-top: 24.121%; } /* 96 / 398 of the box's own width */
      #pc-intro .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
      #pc-intro .strip { position: absolute; top: -10%; bottom: -10%; left: 0; width: 100%; background: #05070F; will-change: transform; }
      #pc-intro .strip.l { animation: pci-sl 520ms cubic-bezier(.4, 0, .2, 1) 740ms both; }
      #pc-intro .strip.r { animation: pci-sr 520ms cubic-bezier(.4, 0, .2, 1) 740ms both; }
      #pc-intro .slide { position: absolute; top: 0; right: 0; bottom: 0; left: 0; will-change: transform; animation: pci-slide 520ms cubic-bezier(.4, 0, .2, 1) 740ms both; }
      #pc-intro .zoom { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 8.040% 52.083%; will-change: transform; animation: pci-zoom 420ms cubic-bezier(0, 0, .2, 1) both; }
      #pc-intro .body { will-change: opacity; animation: pci-in 420ms cubic-bezier(0, 0, .2, 1) both; }
      /* The arcs pulse out from the P's centre (scale + opacity, compositor-only), the inner one first. */
      #pc-intro .arc { transform-origin: 8.040% 52.083%; will-change: transform, opacity; }
      #pc-intro .a1 { animation: pci-arc 280ms cubic-bezier(0, 0, .2, 1) 300ms both; }
      #pc-intro .a2 { animation: pci-arc 300ms cubic-bezier(0, 0, .2, 1) 440ms both; }
      @keyframes pci-sl { from { transform: translateX(-45.502%); } to { transform: translateX(-92.990%); } }
      @keyframes pci-sr { from { transform: translateX(53.744%); } to { transform: translateX(101.608%); } }
      @keyframes pci-slide { from { transform: translateX(41.960%); } to { transform: none; } }
      @keyframes pci-zoom { from { transform: scale(.85); } to { transform: none; } }
      @keyframes pci-in { from { opacity: 0; } to { opacity: 1; } }
